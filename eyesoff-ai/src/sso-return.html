<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Signing you in…</title>
<style>
  html { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0d12; color: #9aa3b2;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #4a5262; } }
</style>
</head>
<body>
<p id="msg">Signing you in…</p>
<script>
/* The popup sign-in's landing pad. The chat page opened enclave.host in a
   popup; the console redirected the popup back HERE with the token in the
   fragment. Being same-origin with the opener again, this page may hand the
   fragment over and close - postMessage works whatever COOP the console
   carries, because the pass happens between two documents of THIS origin.
   It only ferries: the chat page verifies the state echo before trusting
   anything, exactly as it does on the full-page flow. No opener (a popup
   blocker promoted the window to a tab, or someone opened the link
   directly): carry the fragment to the chat page instead, whose boot parser
   runs the same acceptance. */
(function () {
  var frag = location.hash || "";
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  var handed = false;
  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage({ enclave_sso: frag }, new URL(".", location.href).origin);
      handed = true;
    } catch (e) {}
  }
  if (handed) {
    document.getElementById("msg").textContent = "Signed in. You can close this window.";
    window.close();
  } else {
    location.replace("./" + frag);
  }
})();
</script>
</body>
</html>
