[package]
name = "snapshot-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
serde_json = "1"

[workspace]
