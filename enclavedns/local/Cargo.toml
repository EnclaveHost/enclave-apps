[package]
name = "enclavedns-local"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"
description = "EnclaveDNS Local: opens .eth sites in an ordinary browser through the IPFS, Swarm, Arweave and Tor software on this machine, and explains what is missing when it isn't there."

# A native daemon for the user's own machine (not an enclave app). It answers
# DNS for .eth on its own loopback address, asks EnclaveDNS (DoH and its ENS
# API) what each name holds, and serves the site from a LOCAL backend: kubo,
# a Bee node, an AR.IO gateway or Tor. It never falls back to a public gateway.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
hickory-proto = { version = "0.24", default-features = false }
tokio-socks = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
# HTTPS for .eth: a CA made on this machine, name-constrained to .eth/.ens,
# that signs a certificate per name on demand
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
