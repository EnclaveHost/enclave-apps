<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#080d14;--panel:#0f1722;--panel2:#131d2a;--line:#22303f;--line2:#2f4053;--text:#e3eaf2;--dim:#93a4b6;--faint:#5f7184;--acc:#8fb4ff;--acc2:#b9cfff;--ok:#5fd4a0;--warn:#ffc36e;--bad:#ff8a8a;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc2);text-decoration:underline}
header.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:#0a111a;position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column}.brand small{font:11px var(--mono);letter-spacing:3px;color:var(--acc)}.brand a{color:var(--text);font-size:18px;font-weight:600}
.spacer{flex:1}
.who{font:12px var(--mono);color:var(--dim);padding:4px 10px;border:1px solid var(--line2);border-radius:999px}
.who.admin{color:var(--warn);border-color:#5a4a2a}
button,.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--acc);text-decoration:none;color:var(--text)}
button.primary{background:#1d3357;border-color:#33558a}button.danger{border-color:#6a3030;color:var(--bad)}
input,select,textarea{font:inherit;color:var(--text);background:#09111b;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px}
main{max-width:1180px;margin:0 auto;padding:24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 18px;overflow:hidden}
.panel>.head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.panel>.body{padding:16px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}h2{font-size:16px;margin:0}
.muted{color:var(--dim)}.faint{color:var(--faint)}.mono{font-family:var(--mono)}
.badge{font:11px var(--mono);padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.badge.pub{color:var(--ok);border-color:#24533f}.badge.priv{color:var(--warn);border-color:#5a4a2a}
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:block;color:var(--text)}
.card:hover{border-color:var(--line2);text-decoration:none;color:var(--text)}
.card .name{font-weight:600;font-size:15px;color:var(--acc)}.card p{margin:6px 0 0;color:var(--dim);min-height:1.5em}
.card .meta{margin-top:10px;font:12px var(--mono);color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td,th{padding:7px 16px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
tr:first-child td{border-top:0}th{color:var(--dim);font-weight:500;font-size:12px;background:var(--panel2)}
td.size,td.when{color:var(--faint);font:12px var(--mono);white-space:nowrap;text-align:right;width:1%}
tr.row:hover td{background:#111b27}
.ico{display:inline-block;width:18px;color:var(--faint);font-family:var(--mono)}
.crumbs{font-family:var(--mono);font-size:13px}.crumbs span{color:var(--faint);margin:0 4px}
pre.code{margin:0;font:12.5px/1.55 var(--mono);overflow:auto;counter-reset:ln;white-space:pre;tab-size:4}
pre.code .l{display:block;padding:0 16px 0 0}pre.code .l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:52px;padding-right:14px;text-align:right;color:var(--faint);user-select:none;border-right:1px solid var(--line);margin-right:14px}
pre.readme{margin:0;padding:16px;font:13px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.commit{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:baseline}.commit:first-child{border-top:0}
.commit .s{flex:1;min-width:0}.commit .s a{color:var(--text)}.commit .s .by{color:var(--faint);font-size:12px}
.sha{font:12px var(--mono);color:var(--acc)}
.clone{display:flex;gap:8px;align-items:center}.clone input{font:12px var(--mono)}
.tabs{display:flex;gap:4px;margin:14px 0}.tabs a{padding:6px 12px;border-radius:8px;color:var(--dim)}.tabs a.on{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row2>*{flex:1;min-width:200px}
#status{position:fixed;bottom:16px;right:16px;max-width:520px;background:#1b2636;border:1px solid var(--line2);border-radius:10px;padding:10px 14px;display:none;z-index:9}
#status.err{border-color:#6a3030;color:var(--bad)}
.notice{background:#132036;border:1px solid #2a4570;border-radius:10px;padding:12px 14px;margin:10px 0;color:var(--acc2)}
.secret{font:13px var(--mono);background:#0a1a10;border:1px solid #24533f;color:var(--ok);padding:10px;border-radius:8px;overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--dim)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:12px;max-width:520px;width:92%}
dialog::backdrop{background:#0008}
img.preview{max-width:100%;display:block;margin:16px auto;background:repeating-conic-gradient(#1a2330 0 25%,#141c27 0 50%) 0 0/16px 16px}
@media(max-width:700px){main{padding:14px}header.top{padding:10px 14px}td.when{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><small>ENCLAVE / DEPOT</small><a href="#/" id="title">__TITLE__</a></div>
  <div class="spacer"></div>
  <span class="who" id="who">anonymous</span>
  <button id="tokbtn" title="Use an access token">Access token</button>
  <button id="ssobtn" hidden>Sign in with Enclave</button>
  <button id="outbtn" hidden>Sign out</button>
</header>
<main id="view"></main>
<div id="status" role="status"></div>
<dialog id="tokdlg">
  <h2>Access token</h2>
  <p class="muted">Paste a depot token. It is kept in this tab only (session storage) and sent as <span class="mono">X-Api-Key</span>.</p>
  <input id="tokin" type="password" autocomplete="off" placeholder="dpt_…">
  <p><button class="primary" id="toksave">Use token</button> <button id="tokcancel">Cancel</button></p>
</dialog>
<script src="/app.js"></script>
</body>
</html>
