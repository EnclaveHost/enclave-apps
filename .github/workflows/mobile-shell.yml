name: mobile-shell

# Builds the verify-first shell and produces an installable debug APK as a
# workflow artifact. This box has no Android SDK; the runner does.
on:
  push:
    branches: [main]
    paths:
      - "mobile-shell/**"
      - ".github/workflows/mobile-shell.yml"
  workflow_dispatch:

# contents: write solely for the fixed-tag release upload the dashboard
# links to; the build itself never writes to the repo
permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-shell/package-lock.json

      - run: npm ci

      - run: npm run build

      # Network-dependent by nature (live deployment + Sigstore + GitHub), so
      # informative, never a merge gate.
      - name: verify live deployment (non-blocking)
        run: npm run test:live
        continue-on-error: true

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: build signed release APK
        working-directory: mobile-shell/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: eyesoff-release-apk
          path: mobile-shell/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # The download the dashboard links to: a FIXED tag whose asset is
      # replaced on every main push, so the URL end users hit never changes:
      # https://github.com/EnclaveHost/enclave-apps/releases/download/mobile-eyesoff/eyesoff.apk
      - name: publish APK to the stable release tag
        if: github.ref == 'refs/heads/main'
        working-directory: mobile-shell/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk eyesoff.apk
          gh release view mobile-eyesoff --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create mobile-eyesoff --repo "$GITHUB_REPOSITORY" \
              --title "eyesoff.ai for Android" \
              --notes "Always the latest signed build of the eyesoff.ai mobile shell. Verifies the enclave before the app loads."
          gh release upload mobile-eyesoff eyesoff.apk --clobber --repo "$GITHUB_REPOSITORY"
