[package]
name = "sia-s3"
version = "0.2.0"
edition = "2024"
description = "An S3 endpoint backed by Sia, served from an attested enclave: objects are encrypted client-side and erasure-coded across Sia hosts through an indexer (sia.enclave.host); the key index lives in the objects' own encrypted metadata, so a restart rebuilds it with nothing stored locally."
license-file = "../LICENSE"
publish = false

# A run-mode service app (single wasm32-wasip2 command component). The Sia
# SDK is vendored with the wasip2 patch (vendor/sia-sdk-rs, see UPSTREAM):
# native SiaMux over wasi:sockets, reqwest_wasi for the indexer API, and every
# dial through the deployment's SOCKS5 egress front.
[dependencies]
sia_storage = { path = "vendor/sia-sdk-rs/sia_storage" }
reqwest_wasi = { path = "vendor/sia-sdk-rs/reqwest_wasi" }
sia_mux = { path = "vendor/sia-sdk-rs/sia_mux" }
sia_core = { path = "vendor/sia-sdk-rs/sia_core" }
ed25519-dalek = "3.0.0"
log = { version = "0.4", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
url = "2.5"
chrono = "0.4"
httparse = "1"
getrandom = "0.3"

[dev-dependencies]
sia_storage = { path = "vendor/sia-sdk-rs/sia_storage", features = ["mock"] }

[workspace]
exclude = ["vendor"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Tests drive real erasure coding, encryption and sector proofs through the mock network; with unoptimized
# dependencies each 4 MiB-sector slab takes seconds. Only dev/test builds change; release is as above.
[profile.dev.package."*"]
opt-level = 2
