Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "true"
EndSection
Section "Device"
    Identifier "VirtualDisplay"
    Driver "dummy"
    VideoRam 16384
EndSection
Section "Monitor"
    Identifier "Monitor"
    HorizSync 28.0-80.0
    VertRefresh 48.0-75.0
    Modeline "1280x800" 83.50 1280 1352 1480 1680 800 803 809 831 -hsync +vsync
EndSection
Section "Screen"
    Identifier "Screen"
    Device "VirtualDisplay"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800"
    EndSubSection
EndSection
