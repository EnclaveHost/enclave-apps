Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "true"
EndSection
Section "Device"
    Identifier "VirtualDisplay"
    Driver "dummy"
    VideoRam 16384
EndSection
Section "Monitor"
    Identifier "Monitor"
    HorizSync 28.0-80.0
    VertRefresh 48.0-75.0
    # Match the original RISC Box desktop's 960x600 display.
    Modeline "960x600" 46.00 960 1000 1096 1232 600 603 613 623 -hsync +vsync
EndSection
Section "Screen"
    Identifier "Screen"
    Device "VirtualDisplay"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "960x600"
    EndSubSection
EndSection
