sunshine_name = KVM Box
capture = x11
encoder = software
sw_preset = ultrafast
sw_tune = zerolatency
hevc_mode = 1
av1_mode = 1
address_family = ipv4
bind_address = 127.0.0.1
upnp = disabled
origin_web_ui_allowed = pc
lan_encryption_mode = 2
wan_encryption_mode = 2
stream_audio = enabled
file_apps = /sunshine-apps.json
credentials_file = /home/desktop/.config/sunshine/sunshine_state.json
log_path = /tmp/sunshine-internal.log
