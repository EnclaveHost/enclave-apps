<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Enclave</title>
<style>
  :root { color-scheme: dark; --bg: #16181d; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: #ececec;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { text-align: center; max-width: 30rem; padding: 2rem; }
  .mark { width: 96px; height: 96px; border-radius: 22%; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 1rem 0 0.25rem; }
  #status { color: #a8a8a8; min-height: 3em; margin-top: 0.75rem; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  #failed h2 { color: #ff8a80; font-size: 1.05rem; margin: 1rem 0 0.5rem; }
  #fail-reason { color: #d8d8d8; }
  #fail-steps {
    text-align: left; white-space: pre-wrap; color: #9a9a9a;
    background: #1a1a1a; border-radius: 10px; padding: 0.75rem 1rem;
    font: 12px/1.6 ui-monospace, monospace; margin: 1rem 0; overflow-x: auto;
  }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 999px;
    padding: 0.6rem 1.5rem; margin: 0.25rem;
  }
  #retry { background: #2dd4bf; color: #10201d; font-weight: 600; }
  #enter-anyway { background: none; color: #8a8a8a; text-decoration: underline; font-size: 0.85rem; }
  .fineprint { color: #6f6f6f; font-size: 0.75rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <!-- the mark, the name, and the background all come from the bundled
       per-app config (splash.js stamps them before first paint settles):
       one static page serves every branded shell -->
  <img class="mark" id="mark" alt="" hidden>

  <div id="verifying">
    <h1 id="app-name"></h1>
    <div id="status" class="pulse">checking the enclave&hellip;</div>
  </div>

  <div id="failed" hidden>
    <h2>The enclave could not be verified</h2>
    <div id="fail-reason"></div>
    <pre id="fail-steps"></pre>
    <button id="retry">Try again</button>
    <br>
    <button id="enter-anyway">continue without verification</button>
  </div>

  <div class="fineprint">
    A pass means the deployment behind this app runs its signed release
    inside real enclave hardware, checked on this device against vendor and
    Sigstore roots.
  </div>
</main>
<script src="splash.bundle.js"></script>
</body>
</html>
