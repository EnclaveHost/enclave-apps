[package]
name = "risc-box"
version = "0.6.46"
edition = "2021"
description = "Boot a real machine on the enclave's CPU from OS images in S3, with the serial console bridged to the browser — a pure-Rust RISC-V system emulator compiled to wasm32-wasip2, run as an Enclave service app."
license-file = "../LICENSE"
publish = false

# The app is a LIBRARY with two front doors, because it has two ways of being
# built and they need different entry points:
#
#   * the ordinary wasip2 component, where `src/main.rs` is a three-line bin
#     that calls `run()` — this is what ships today and is unchanged;
#   * a shared-everything-threads build, where the final link is done by the
#     platform's SET clang wrapper against a C `main` (see set/), so Rust has
#     to present a staticlib and an `extern "C"` entry instead of a bin.
#
# Keeping both means the SET work never forks the app: same modules, same
# `run()`, one extra `#[no_mangle]` shim.
[lib]
name = "risc_box"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "risc-box"
path = "src/main.rs"

# A run-mode service app (single wasm32-wasip2 command component): std maps to
# wasi:sockets/clocks/cli. Dependencies are the emulator (vendored, path) and a
# pure-Rust TLS stack — the only one that builds for wasm32-wasip2 — plus the
# SigV4 hash primitives. serde_json parses the app config. The suite's httpd.rs
# and the S3 client are hand-rolled std (src/httpd.rs, src/s3.rs).
[dependencies]
riscv_emu_rust = { path = "emu" }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
webpki-roots = "0.26"
sha2 = "0.10"
hmac = "0.12"
# User-mode network for the guest's virtio-net: pure-Rust TCP/IP endpoint the
# app terminates guest ethernet on (DHCP + inbound port-forwards + slirp-style
# outbound NAT with a DNS proxy, src/net.rs).
smoltcp = { version = "0.12", default-features = false, features = [
    "std", "alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp",
] }
# Display scanout (src/display.rs): deflate for the dirty-band SSE stream (the
# browser inflates with DecompressionStream) and for /fb.png's zlib IDAT.
# Pure Rust, builds for wasm32-wasip2 like everything else here.
miniz_oxide = "0.8"
# Video encode path (src/video.rs): a real video codec bitstream for the guest
# desktop, encoded in the APP (wasmtime-JIT speed) not the emulated guest.
# jpeg-encoder is the first, pure-Rust, wasm-friendly backend (Motion JPEG);
# the VideoEncoder trait is the seam an H.264/HEVC backend — software here, or
# NVENC offloaded to the H200 — drops into. See docs/streaming.md.
jpeg-encoder = { version = "0.6", default-features = false }
# The efficient (inter-frame) video codec backend: rav1e, a pure-Rust AV1
# encoder that builds for wasm32-wasip2 (H.264 was the intent, but openh264/x264
# are C and their build scripts reject the wasi target; AV1 is pure Rust and
# more efficient anyway — a mostly-static desktop compresses to a handful of
# bytes/frame vs ~20KB for Motion JPEG). default-features off drops the x86/arm
# asm + threading the wasm target can't use. See docs/streaming.md.
rav1e = { version = "0.7", default-features = false }
# The GPU interface. PLATFORM.md §0: a tenant reaches the card ONLY through the
# wasi-nn shims, so hardware encode arrives as a preload-only graph rather than
# a subprocess. Bindings are generated at compile time from wit/ by the macro
# (this crate is a plain cargo build, not cargo-component, so there is no
# checked-in bindings.rs).
wit-bindgen = { version = "0.41", default-features = false, features = ["macros", "realloc"] }
# GameStream host crypto, all pure Rust so it builds for wasm32-wasip2 (the
# native bridge used openssl, which is C and does not). AES-128 in three modes:
# GCM for the control channel, CBC for audio, ECB for the pairing handshake.
# RSA + SHA-256 sign the pairing challenge and the self-signed serving cert.
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Reading the CLIENT's pairing certificate (its public key and signature). The
# serving cert is assembled by hand in gamestream::pair -- rcgen would do it in
# a tenth of the code but every one of its crypto backends is C (ring/aws-lc)
# and will not cross-compile to wasm32-wasip2, which is the same wall openssl
# hit and the reason this port exists.
x509-parser = "0.16"

[profile.release]
opt-level = 3       # the CPU loop is hot; favor speed over size here
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The shared-everything-threads build turns this on; see src/worker.rs. Off by
# default so the ordinary wasip2 component is byte-for-byte the app that ships.
[features]
set = []
# baked-region JIT: profile-derived native regions compiled into the emulator
# (see emu/build.rs + emu/aot/regions.dump). The app enables the dispatcher
# at machine start when this is on.
aot = ["riscv_emu_rust/aot"]
