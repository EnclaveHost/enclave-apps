# Xorg on the simple-framebuffer with a virtio-input HID.
#
# The guest has no udev, so X cannot auto-discover input devices — every input
# is declared statically here and AutoAddDevices stays off. The emulator's
# virtio-input device (DTB virtio_mmio@10003000) binds to evdev as
# /dev/input/event0; the libinput driver reads it and gives the session an
# absolute pointer (a cursor) plus a keyboard. This is the interface a remote
# or streaming client's injected mouse/keyboard arrives at the desktop through.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "DontVTSwitch" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# Preload fbdevhw so the fbdev driver's fbdevHW* symbols resolve (see
# xdesktop.sh; LD_PRELOAD is the real fix, this is belt-and-suspenders).
Section "Module"
	Load "fbdevhw"
	Load "shadow"
EndSection

# The display. Two drivers are possible on this machine and the choice is
# made here, not auto-detected: the guest has no udev, so nothing discovers
# devices on its own.
#
#   modesetting on /dev/dri/card0 — the virtio-gpu at DTB virtio_mmio@10005000.
#     This is the one worth having: the guest names its damage rectangles, so
#     the host re-encodes only what changed instead of diffing whole frames,
#     and the pointer gets its own plane so moving the mouse stops dirtying
#     the picture underneath it.
#
#   fbdev on /dev/fb0 — the simple-framebuffer. Kept below, commented, because
#     a kernel built without CONFIG_DRM_VIRTIO_GPU has no card0 and this file
#     is the only thing standing between that image and a dead session.
#
# AccelMethod "none" is REQUIRED, not tuning. modesetting's default is glamor,
# which wants a GL driver; there is no GPU behind this device and Mesa would
# fall back to a software rasterizer running on an emulated RV64 core with no
# vector unit — slower than the shadow-buffer copy path by a wide margin.
Section "Device"
	Identifier "fb"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
EndSection

# Fallback for an image whose kernel predates virtio-gpu:
# Section "Device"
#	Identifier "fb"
#	Driver "fbdev"
#	Option "fbdev" "/dev/fb0"
# EndSection

# The virtio-input HID, bound explicitly (no udev to discover it). One evdev
# node carries both the absolute pointer and the keyboard; libinput fans it
# out into a pointer + a keyboard for the session.
Section "InputDevice"
	Identifier "virtio-hid"
	Driver "libinput"
	Option "Device" "/dev/input/event0"
EndSection

Section "ServerLayout"
	Identifier "layout"
	Screen "screen"
	InputDevice "virtio-hid" "CorePointer"
	InputDevice "virtio-hid" "CoreKeyboard"
EndSection

Section "Screen"
	Identifier "screen"
	Device "fb"
EndSection
