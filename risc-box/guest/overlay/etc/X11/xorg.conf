# Xorg on the simple-framebuffer with a virtio-input HID.
#
# The guest has no udev, so X cannot auto-discover input devices — every input
# is declared statically here and AutoAddDevices stays off. The emulator's
# virtio-input device (DTB virtio_mmio@10003000) binds to evdev as
# /dev/input/event0; the libinput driver reads it and gives the session an
# absolute pointer (a cursor) plus a keyboard. This is the interface a remote
# or streaming client's injected mouse/keyboard arrives at the desktop through.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "DontVTSwitch" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# Preload fbdevhw so the fbdev driver's fbdevHW* symbols resolve (see
# xdesktop.sh; LD_PRELOAD is the real fix, this is belt-and-suspenders).
Section "Module"
	Load "fbdevhw"
	Load "shadow"
EndSection

Section "Device"
	Identifier "fb"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
EndSection

# The virtio-input HID, bound explicitly (no udev to discover it). One evdev
# node carries both the absolute pointer and the keyboard; libinput fans it
# out into a pointer + a keyboard for the session.
Section "InputDevice"
	Identifier "virtio-hid"
	Driver "libinput"
	Option "Device" "/dev/input/event0"
EndSection

Section "ServerLayout"
	Identifier "layout"
	Screen "screen"
	InputDevice "virtio-hid" "CorePointer"
	InputDevice "virtio-hid" "CoreKeyboard"
EndSection

Section "Screen"
	Identifier "screen"
	Device "fb"
EndSection
