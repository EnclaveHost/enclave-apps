# GTK3 defaults for the RISC Box guest.
#
# Animations are the expensive default: every menu fade and button transition
# is a timed sequence of full software repaints on an emulated CPU, and each
# repaint is a frame the streaming encoder then has to carry. Turning them off
# makes the desktop feel like it responds immediately rather than smearing.
[Settings]
gtk-enable-animations=0
gtk-font-name=DejaVu Sans 9
gtk-icon-theme-name=Adwaita
# No icons in menus and buttons: fewer scaled pixmaps to composite per menu.
gtk-menu-images=0
gtk-button-images=0
# Overlay scrollbars need a compositor to look right and cost redraws here.
gtk-primary-button-warps-slider=1
