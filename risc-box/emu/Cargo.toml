# Vendored from https://github.com/takahirox/riscv-rust
# commit 8ee69d7a5dc7ef6d8b2bda96bf86d2923f2cf176 (MIT, see LICENSE).
# src/* is upstream plus a set of local changes, every one of them tagged
# "risc-box patch" in-line — `git grep "risc-box patch" src/` is the index.
# They have outgrown the list that used to live here (disk readback, the
# software TLB and predecoded instruction cache, virtio-net and virtio-input,
# decimated device servicing); read the tags rather than trusting a summary
# here to have kept up.
# This Cargo.toml is ours (upstream's declares a cli/wasm workspace we
# don't vendor), as is examples/ (the throughput benchmark).
[package]
name = "riscv_emu_rust"
version = "0.2.0"
description = "RISC-V emulator written in Rust (vendored for risc-box)"
license = "MIT"
publish = false

[dependencies]
fnv = "1.0.7"
# risc-box patch: deflate for the machine snapshot (src/snapshot.rs). Pure
# Rust, the same crate the app already uses for its band stream and gzip.
miniz_oxide = "0.8"

[features]
# jit-proto sizing aid: per-block execution counters + a coverage histogram
# (what share of retired instructions ran in blocks hot enough to compile).
# Costs a counter bump per block dispatch; never enabled in shipped builds.
blockstats = []
# the PLATFORM-JIT.md translator (src/jit.rs); equivalence tests in cpu.rs
jit = []
# tier-2 dispatch wired into the run loop in COVERAGE mode: regions form and
# "compile" into a recording backend, and the loop counts how much of the
# retired stream would have flowed through compiled regions. The go/no-go
# number for baking AOT regions into the app.
tier2 = ["jit"]
# tier-2 with BAKED native regions: build.rs turns aot/regions.dump (from a
# --tier2 profiling run) into native functions keyed by region-module hash;
# the dispatcher runs them in place of interpreting. All app-side — no
# platform verb involved.
aot = ["tier2"]

# examples/jit-proto.rs only: executes runtime-emitted wasm natively to
# measure the translator half of PLATFORM-JIT.md before the platform verb
# exists. Never linked into the library or the shipped app.
[dev-dependencies]

