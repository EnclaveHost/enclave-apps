<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" font-family="monospace">
  <rect width="1600" height="400" fill="#0b0e14"/>
  <radialGradient id="g" cx="20%" cy="0%" r="90%">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity=".12"/>
    <stop offset="60%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="400" fill="url(#g)"/>
  <rect x="6" y="6" width="1588" height="388" rx="18" fill="none" stroke="#1e2430" stroke-width="4"/>

  <!-- wordmark: the IPNS system yields your stable k51 name -->
  <text x="90" y="170" font-size="84" fill="#a78bfa">[ ipns <tspan fill="#5a6375">&#8594;</tspan> <tspan fill="#d7dde8" font-weight="bold">k51&#8230;</tspan> ]</text>
  <text x="96" y="252" font-size="30" fill="#8a94a6">an IPNS name whose signing key never leaves the enclave</text>
  <text x="96" y="310" font-size="24" fill="#5a6375">ed25519 signed in a TEE &#183; records verify in kubo &#183; sequence stays monotonic</text>
  <text x="96" y="348" font-size="24" fill="#5a6375">/routing/v1 &#183; delegated PUT &#183; Kademlia PUT_VALUE &#8594; hand-rolled libp2p, no rust-libp2p</text>

  <!-- the motif: a key held in the enclave, broadcasting the name to the DHT -->
  <!-- broadcast waves -->
  <g fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round">
    <path d="M1342.6 175.5 A32 32 0 0 1 1342.6 224.5" opacity="0.9"/>
    <path d="M1359.3 155.6 A58 58 0 0 1 1359.3 244.4" opacity="0.55"/>
    <path d="M1376 135.7 A84 84 0 0 1 1376 264.3" opacity="0.32"/>
  </g>
  <!-- peer nodes receiving the record -->
  <g fill="#a78bfa">
    <circle cx="1400" cy="150" r="7" opacity="0.7"/>
    <circle cx="1416" cy="200" r="8"/>
    <circle cx="1400" cy="250" r="7" opacity="0.7"/>
  </g>
  <!-- the key: hexagonal bow + shaft + bit -->
  <g fill="#a78bfa">
    <rect x="1252" y="189" width="70" height="22"/>
    <rect x="1288" y="211" width="13" height="22"/>
    <rect x="1305" y="211" width="15" height="34"/>
    <polygon points="1200,140 1251.96,170 1251.96,230 1200,260 1148.04,230 1148.04,170"/>
  </g>
  <!-- keyhole: custody held in the enclave -->
  <g fill="#0b0e14">
    <circle cx="1200" cy="190" r="16"/>
    <polygon points="1191,200 1209,200 1213,230 1187,230"/>
  </g>
</svg>
