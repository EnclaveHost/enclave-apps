[package]
name = "capacity-work"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE"
description = "Paid CPU and memory verification work through Enclave's normal isolated app runtime"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "=1.0.0"
[profile.release]
opt-level = 3
lto = "thin"
strip = true
